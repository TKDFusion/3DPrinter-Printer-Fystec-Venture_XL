#####################################################################
#	Macros
#####################################################################

#[gcode_macro PROBE_CALIBRATE]
#gcode:
#    CARTOGRAPHER_CALIBRATE

[gcode_macro G32]
gcode:
    BED_MESH_CLEAR
    G28
    QUAD_GANTRY_LEVEL
    G28
    ##	Uncomment for for your size printer:
    #--------------------------------------------------------------------
    G0 X300 Y300 Z30 F3600
    #--------------------------------------------------------------------
   

[gcode_macro PRINT_START]
#   Use PRINT_START for the slicer starting script - please customise for your slicer of choice
gcode:
    {% set DEFAULT_EXTRUDER_TEMP = 140 %}
    {% set BED_TEMP = params.BED_TEMP|default(0)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(0)|float %}
    {% set PRINT_MIN = params.PRINT_MIN|default("0,0")|float %}
    {% set PRINT_MAX = params.PRINT_MAX|default("600,600")|float %}
    
    # STATUS_HEATING
    
    G90
    SET_HEATER_TEMPERATURE HEATER=heater_bed_1 TARGET={BED_TEMP}
    SET_HEATER_TEMPERATURE HEATER=heater_bed_2 TARGET={BED_TEMP}
    SET_HEATER_TEMPERATURE HEATER=heater_bed_3 TARGET={BED_TEMP}
    SET_HEATER_TEMPERATURE HEATER=heater_bed_4 TARGET={BED_TEMP}
    G4 P40000
    # M109 S{DEFAULT_EXTRUDER_TEMP}
    G32
    
    # STATUS_PART_READY
    
    #CARTOGRAPHER_TOUCH
    SET_HEATER_TEMPERATURE HEATER=heater_bed_4
    SET_HEATER_TEMPERATURE HEATER=heater_bed_3
    SET_HEATER_TEMPERATURE HEATER=heater_bed_2
    SET_HEATER_TEMPERATURE HEATER=heater_bed_1
    
    # STATUS_MESHING
    
    BED_MESH_CALIBRATE  ADAPTIVE=1 ADAPTIVE_MARGIN=5
    #PRINT_MIN={PRINT_MIN} PRINT_MAX={PRINT_MAX} BED_TEMP={BED_TEMP}
    #BED_MESH_PROFILE LOAD=default
    
    # STATUS_CLEANING
    
    #BLOBIFIER    
    M109 S{EXTRUDER_TEMP}
    LINE_PURGE 
    
    # STATUS_PRINTING

[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-5.0 F3600                ; retract filament
    G91                            ; relative positioning`
    G0 Z3.00 X20.0 Y20.0 F20000    ; move nozzle to remove stringing
    TURN_OFF_HEATERS
    M107                           ; turn off fan
    G1 Z4 F3000                    ; move nozzle up 2mm
    G90                            ; absolute positioning
    #G0  X125 Y250 F3600            ; park nozzle at rear
    G28 X Y
    BED_MESH_CLEAR
    #STATUS_READY

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout} ; set timeout back to configured value
    CLEAR_PAUSE
    SDCARD_RESET_FILE
    PRINT_END
    BASE_CANCEL_PRINT


[filament_switch_sensor Filament_sensor]
pause_on_runout: True
#   When set to True, a PAUSE will execute immediately after a runout
#   is detected. Note that if pause_on_runout is False and the
#   runout_gcode is omitted then runout detection is disabled. Default
#   is True.
#runout_gcode:
#   A list of G-Code commands to execute after a filament runout is
#   detected. See docs/Command_Templates.md for G-Code format. If
#   pause_on_runout is set to True this G-Code will run after the
#   PAUSE is complete. The default is not to run any G-Code commands.
insert_gcode:
  M118 Filament loading!                         ; display message
  M82                                            ; set extruder to absolute mode
  G92 E0
  G4 P1000                                       ; wait for one second
  G1 E42 F500                                    ; load filament inside the gears
  M109 S235                                      ; set hotend temperature and wait
  G1 E75 F500                                    ; extrude 75mm, you may need to reduce speed for very soft TPU
  M104 S0 T0                                     ; set hotend temperature to 0
  M118 Filament load complete!                   ; display message
event_delay: 3.0
#   The minimum amount of time in seconds to delay between events.
#   Events triggered during this time period will be silently
#   ignored. The default is 3 seconds.
pause_delay: 0.5
#   The amount of time to delay, in seconds, between the pause command
#   dispatch and execution of the runout_gcode. It may be useful to
#   increase this delay if OctoPrint exhibits strange pause behavior.
#   Default is 0.5 seconds.
switch_pin: sb_combo:PB11
#   The pin on which the switch is connected. This parameter must be
#   provided.

[gcode_macro LOAD_FILAMENT]
variable_load_distance:  42
variable_purge_distance:  75
gcode:
    {% set speed = params.SPEED|default(300) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity  * 60 %}
    SAVE_GCODE_STATE NAME=load_state
    M104 S235  #set hotend temperature
    G91
    G92 E0
    G1 E{load_distance} F{max_velocity} # fast-load
    M109 S235  #set hotend temperature and wait
    G1 E{purge_distance} F{speed} # purge
    M104 S0 T0    #set hotend temperature to 0
    RESTORE_GCODE_STATE NAME=load_state

[gcode_macro UNLOAD_FILAMENT]
variable_unload_distance:  75
variable_purge_distance:  25
gcode:
    {% set speed = params.SPEED|default(300) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity  * 60 %}
    SAVE_GCODE_STATE NAME=unload_state
    G91
    G92 E0
    G1 E{purge_distance} F{speed} # purge
    G1 E-{unload_distance} F{max_velocity} # fast-unload
    RESTORE_GCODE_STATE NAME=unload_state    
    
[force_move]
enable_force_move: True

[gcode_macro TEST_MOVE_X]
gcode:
    force_move stepper=stepper_x distance=1000 velocity=100
[gcode_macro TEST_MOVE_Y]
gcode:
    force_move stepper=stepper_y distance=1000 velocity=100
[gcode_macro TEST_MOVE_Z]
gcode:
    force_move stepper=stepper_z distance=100 velocity=10
[gcode_macro TEST_MOVE_Z1]
gcode:
    force_move stepper=stepper_z1 distance=100 velocity=10
[gcode_macro TEST_MOVE_Z2]
