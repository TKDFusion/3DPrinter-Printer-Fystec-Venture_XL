#####################################################################

[fan]
pin: sb_combo:PB0    #EXT-FAN0 #FAN1=PB5

[heater_fan hotend_fan]
pin: sb_combo:PB7    #EXT-FAN1 #FAN0=PB6
shutdown_speed: 0

