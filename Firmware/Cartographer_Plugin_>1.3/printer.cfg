#####################################################################
#      X/Y Stepper Settings
#####################################################################

[stepper_x]

position_endstop: 657.5
position_max: 657.5
homing_speed: 200 
homing_retract_dist: 0
homing_positive_dir: true
endstop_pin:sb_combo:PA2

[stepper_y]

position_endstop: 622.5
position_max: 622.5
homing_speed: 200 
homing_retract_dist: 0
homing_positive_dir: true
endstop_pin:sb_combo:PA3

#####################################################################
#   Z Stepper Settings
#####################################################################

[stepper_z]
rotation_distance: 40
endstop_pin: probe:z_virtual_endstop 
position_max: 600
position_min: -15
homing_speed: 20 #50
second_homing_speed: 10
homing_retract_dist: 0


#####################################################################
#	Bed Mesh
#####################################################################
[bed_mesh]
zero_reference_position: 300, 300 # The centre of your bed. 
speed: 200
horizontal_move_z: 3
mesh_min: 20, 23 # The first probed coordinate, nearest to the origin. This coordinate is relative to the probe's location.
mesh_max: 580, 581.1 # The probed coordinate farthest from the origin. This is not necessarily the last point probed, as the probing process occurs in a zig-zag fashion. As with mesh_min, this coordinate is relative to the probe's location.
probe_count: 38, 38
adaptive_margin: 10
mesh_pps: 0,0 # Disable interpolation - mesh is probably dense enough
algorithm: bicubic
bicubic_tension: 0.2  #
move_check_distance: 5  #
split_delta_z: .025  #

#####################################################################
#	Homing and Gantry Adjustment Routines
#####################################################################

[idle_timeout]
#gcode:
#   A list of G-Code commands to execute on an idle timeout. See
#   docs/Command_Templates.md for G-Code format. The default is to run
#   "TURN_OFF_HEATERS" and "M84".
timeout: 600
#   Idle time (in seconds) to wait before running the above G-Code
#   commands. The default is 600 seconds.

[safe_z_home]
##	XY Location of the Z Endstop Switch
##	Update -10,-10 to the XY coordinates of your endstop pin 
##	(such as 157,305) after going through Z Endstop Pin
##	Location Definition step.
#move_to_previous: False
home_xy_position:300,300
speed:200 #100
z_hop:10

# [z_tilt]
# z_positions:
# 	-84.5,113.5
#     -84.5,694.5
# 	708.5,694.5
#     708.5,113.5 
# #   A list of X, Y coordinates (one per line; subsequent lines
# #   indented) describing the location of each bed "pivot point". The
# #   "pivot point" is the point where the bed attaches to the given Z
# #   stepper. It is described using nozzle coordinates (the X, Y position
# #   of the nozzle if it could move directly above the point). The
# #   first entry corresponds to stepper_z, the second to stepper_z1,
# #   the third to stepper_z2, etc. This parameter must be provided.
# points:
# 	50,50
# 	50,550
# 	550,550
# 	550,50
# #   A list of X, Y coordinates (one per line; subsequent lines
# #   indented) that should be probed during a Z_TILT_ADJUST command.
# #   Specify coordinates of the nozzle and be sure the probe is above
# #   the bed at the given nozzle coordinates. This parameter must be
# #   provided.
# speed: 50
# #   The speed (in mm/s) of non-probing moves during the calibration.
# #   The default is 50.
# horizontal_move_z: 5
# #   The height (in mm) that the head should be commanded to move to
# #   just prior to starting a probe operation. The default is 5.
# retries: 5
# #   Number of times to retry if the probed points aren't within
# #   tolerance.
# retry_tolerance: 0.02
# #   If retries are enabled then retry if largest and smallest probed
# #   points differ more than retry_tolerance. Note the smallest unit of
# #   change here would be a single step. However if you are probing
# #   more points than steppers then you will likely have a fixed
# #   minimum value for the range of probed points which you can learn
# #   by observing command output.

   
[quad_gantry_level]
##	Use QUAD_GANTRY_LEVEL to level a gantry.
##	Min & Max gantry corners - measure from nozzle at MIN (0,0) and 
##	MAX (250, 250), (300,300), or (350,350) depending on your printer size
##	to respective belt positions

#--------------------------------------------------------------------

##	Gantry Corners for TAP 350mm Build
##	Uncomment for TAP 350mm build
gantry_corners:
	-84.5,113.5   #-126,-110
	708.5,694.5   #726,686
##	Probe points
points:
	50,20
	50,550
	550,550
	550,20

#--------------------------------------------------------------------
speed: 200 #500
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.02
max_adjust: 15

# [axis_twist_compensation]
# #speed: 50
# #   The speed (in mm/s) of non-probing moves during the calibration.
# #   The default is 50.
# #horizontal_move_z: 5
# #   The height (in mm) that the head should be commanded to move to
# #   just prior to starting a probe operation. The default is 5.
# calibrate_start_x: 20
# #   Defines the minimum X coordinate of the calibration
# #   This should be the X coordinate that positions the nozzle at the starting
# #   calibration position. This parameter must be provided.
# calibrate_end_x: 580
# #   Defines the maximum X coordinate of the calibration
# #   This should be the X coordinate that positions the nozzle at the ending
# #   calibration position. This parameter must be provided.
# calibrate_y: 300
# #   Defines the Y coordinate of the calibration
# #   This should be the Y coordinate that positions the nozzle during the
# #   calibration process. This parameter must be provided and is recommended to
# #   be near the center of the bed

[firmware_retraction]
retract_length: 5
#   The length of filament (in mm) to retract when G10 is activated,
#   and to unretract when G11 is activated (but see
#   unretract_extra_length below). The default is 0 mm.
retract_speed: 20
#   The speed of retraction, in mm/s. The default is 20 mm/s.
unretract_extra_length: 0
#   The length (in mm) of *additional* filament to add when
#   unretracting.
unretract_speed: 10
#   The speed of unretraction, in mm/s. The default is 10 mm/s.


