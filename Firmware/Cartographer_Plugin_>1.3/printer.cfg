[include timelapse.cfg]
[include mainsail.cfg]
[include reshelper.cfg]
#[include testspeed.cfg]
[include KAMP_Settings.cfg]
[include stepper_spp.cfg]
[include Area_Bed.cfg]
# [include stealthburner_led_effects_barf.cfg]
# If you experience frequent "timer too close" errors, you can comment out the LED lighting effects to disable the RGB effects.
[exclude_object]
#[include Stealth_Max.cfg]


[printer]
kinematics: corexy           
max_velocity: 500      # 700 max tested      
max_accel: 40000       # 40000 max tested     
minimum_cruise_ratio: 0.5
max_z_velocity: 5           
max_z_accel: 50             
square_corner_velocity: 5.0  

[mcu cartographer] # See https://www.klipper3d.org/Config_Reference.html#mcu
# Uncomment either the serial or canbus_uuid line dependant on your setup.
#serial: <Replace with your Serial ID>
#canbus_uuid: <Replace with your UUID>
#canbus_interface: can2
#restart_method: command # Not needed for probes using CAN. 

[cartographer]
mcu: cartographer
x_offset: 0 # This is the offset of your probe from the nozzle tip, to the centre of the coil.
y_offset: 23 # This is the offset of your probe from the nozzle tip, to the centre of the coil.
verbose: no # For extra output

[mcu]
# For more information about Spider Pro, please refer to: https://github.com/FYSETC/Spider_Pro
# serial: /dev/serial/by-path/platform-fd840000.usb-usb-0:1:1.0
# serial: /dev/serial/by-id/***                      
canbus_uuid: <Replace with your UUID>
canbus_interface: can2
# serial: ttyS10
# baud: 250000

[mcu sb_combo]
# For more information about SB Combo, please refer to: https://wiki.fysetc.com/SB_Combo_V2/  &  https://github.com/FYSETC/SB_Combo_V2
# serial: /dev/serial/by-id/***
canbus_uuid: <Replace with your UUID>
canbus_interface: can2
# make flash FLASH_DEVICE=0483:df11
# Follow the instruction here https://www.klipper3d.org/CANBUS.html to get CAN id

##  In MOTOR Connector
[extruder]
step_pin: sb_combo:PB3 #PA7
dir_pin: !sb_combo:PA8 #PA5
enable_pin: !sb_combo:PA15 #PB4 

##  Update value below when you perform extruder calibration
##  If you ask for 100mm of filament, but in reality it is 98mm:
##  rotation_distance = <previous_rotation_distance> * <actual_extrude_distance> / 100
##  22.6789511 is a good starting point for Bondtech 5mm gears
##  34.37086 for Bondtech 8mm gears (Galileo)
rotation_distance: 4.45   #22.6789511   #Bondtech 5mm Drive Gears
##  Update Gear Ratio depending on your Extruder Type
##  Use 50:17 for Afterburner/Clockwork (BMG Gear Ratio)
##  Use 80:20 for M4, M3.1
##  Use 7.5:1 for Galileo
##  gear_ratio: 50:10               #for Stealthburner/Clockwork2 BMG Gear Ratio
microsteps: 16
full_steps_per_rotation: 200    #200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: sb_combo:PC15 #PA8 # Heat
## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
## Use "Generic 3950" for NTC 100k 3950 thermistors
sensor_type: Generic 3950
sensor_pin: sb_combo:PA6 #PA0 # TH
min_temp: -273.15 #1 #-273.15 # 1 #zzcatvs mod
max_temp: 99999 #360 #99999 # 360 #zzcatvs mod
max_power: 1.0
min_extrude_temp: 10
#control = pid
#pid_kp = 26.213
#pid_ki = 1.304
#pid_kd = 131.721
##  Try to keep pressure_advance below 1.0
#pressure_advance: 0.02 #0.05
##  Default is 0.040, leave stock
#pressure_advance_smooth_time: 0.040
pressure_advance: 0.025       
pressure_advance_smooth_time: 0.035    
max_extrude_cross_section: 5000.0
max_extrude_only_distance: 500.0


[tmc2209 extruder]
uart_pin: sb_combo:PA10
tx_pin: sb_combo:PA9
interpolate: false
run_current: 0.7
sense_resistor: 0.110
stealthchop_threshold: 0
##diag_pin: sb_combo:PB5

[adxl345]
cs_pin: sb_combo:PB12
spi_software_sclk_pin: sb_combo:PB13
spi_software_mosi_pin: sb_combo:PB15
spi_software_miso_pin: sb_combo:PB14
axes_map: z,-y,-x

[resonance_tester]
accel_chip: adxl345
probe_points:
    300,300,30 # an example

[input_shaper]
#shaper_type_x = zv
#shaper_freq_x = 39
#shaper_type_y = mzv
#shaper_freq_y = 32.6

#[adxl345]
## Select 1 of the cs_pin below depending on the probe you have. 
## Having the wrong one selected will cause an Endless Bootloop
## Cartographer V4 has int2 connected to the probes PA1 pin
#cs_pin: cartographer:PA3 # For Cartographer V3
#cs_pin: cartographer:PA0 # For Cartographer V4
#spi_bus: spi1

#[resonance_tester]
#accel_chip: adxl345
#probe_points:
#    300, 300, 20 # Fill out the blank with x and y coordinates where you want to run the resonance test.

#####################################################################
# RGB
#####################################################################

# 5V RGB LOGO light board located on Stealthburner, 8 RGB + 2 RGBW.    
[neopixel sb_leds]
pin: sb_combo: PC14  #EXT-RGB=PB11 #RGB=PB11
chain_count: 10
color_order: GRB,GRB,GRB,GRB,GRB,GRB,GRB,GRB,RGBW,RGBW
initial_RED: 0.5 #0.5
initial_GREEN: 0.5
initial_BLUE: 0.5 #0.5
initial_WHITE: 0.5 #0.5

# 5V RGB light strip horizontally on the X axis，55 RGB.
[neopixel print_light]
pin: sb_combo: PA0  #IO.2=PA0
chain_count: 55
color_order: GRB
initial_RED: 0.5 #0.5
initial_GREEN: 0.5
initial_BLUE: 0.5 #0.5
#initial_WHITE: 0.5 #0.5

# 24V RGB light strip Vertically on the Z axis，2 x 14 RGB units ( 6 per ).
[neopixel lamp_rgb]
pin: PA1  
chain_count: 28
color_order: BRG
initial_RED: 1.0 
initial_GREEN: 1.0
initial_BLUE: 1.0

